<!DOCTYPE html>
<html lang="en">

<style>
:root{--c1:#19e3ff;--c2:#ff3da6;--c3:#ffd23f;--bg:#050816;--ink:#e8f4ff;--dim:#7f93b8}

html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'Orbitron','Eurostile','Arial Black',Impact,sans-serif;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;display:none;font-style:italic}
#hud .big{font-weight:800;text-shadow:0 0 14px rgba(25,227,255,.7),0 3px 0 rgba(0,0,0,.5)}
#pos{position:absolute;left:3vmin;top:2.4vmin;font-size:min(11vmin,96px);line-height:1;color:#fff}
#pos small{font-size:.38em;color:var(--c1);margin-left:.12em}
#lap{position:absolute;left:3.4vmin;top:calc(2.4vmin + min(12vmin,104px));font-size:min(3.2vmin,28px);color:var(--c3);font-weight:800}
#time{position:absolute;left:3.4vmin;top:calc(2.4vmin + min(12vmin,104px) + min(4.4vmin,38px));font-size:min(2.6vmin,22px);color:#cfe6ff}
#mini{position:absolute;right:2.4vmin;top:2.4vmin;width:min(24vmin,220px);height:min(24vmin,220px);background:rgba(5,10,30,.45);border:2px solid rgba(25,227,255,.45);border-radius:14px}
#spd{position:absolute;right:3vmin;bottom:2.4vmin;text-align:right;font-weight:800;font-size:min(9vmin,80px);line-height:1;color:#fff}
#spd small{display:block;font-size:.26em;color:var(--c1);letter-spacing:.2em}
#airw{position:absolute;left:50%;bottom:3vmin;transform:translateX(-50%);width:min(58vmin,520px)}
#airl{display:flex;justify-content:space-between;font-size:min(2.2vmin,18px);color:var(--c1);letter-spacing:.2em;margin-bottom:.4vmin;font-weight:800}
#airb{height:min(3.6vmin,30px);border:2px solid rgba(255,255,255,.7);border-radius:20px;background:rgba(5,10,30,.55);overflow:hidden;transform:skewX(-14deg)}
#airf{height:100%;width:100%;background:linear-gradient(90deg,#19e3ff,#7dffb0);box-shadow:0 0 18px #19e3ff;transition:background .2s}
#airf.low{background:linear-gradient(90deg,#ff3d3d,#ffb23f);box-shadow:0 0 18px #ff3d3d;animation:blink .4s infinite}
@keyframes blink{50%{opacity:.45}}
#boostb{height:min(1.1vmin,9px);margin-top:.6vmin;background:rgba(255,255,255,.12);transform:skewX(-14deg);border-radius:6px;overflow:hidden}
#boostf{height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff3da6)}
#msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:min(14vmin,128px);color:#fff;text-shadow:0 0 30px var(--c1),0 6px 0 rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
#msg.on{opacity:1}
#sub{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-weight:800;font-size:min(4.4vmin,40px);color:var(--c3);text-shadow:0 0 14px #000;opacity:0;transition:opacity .2s;white-space:nowrap}
#sub.on{opacity:1}
#trick{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;font-weight:800;font-size:min(5vmin,44px);color:var(--c2);text-shadow:0 0 16px #000;opacity:0;white-space:nowrap}
#trick.on{opacity:1}
#board{position:absolute;left:3vmin;bottom:2.4vmin;font-size:min(2.2vmin,18px);line-height:1.5;color:#cfe6ff;text-shadow:0 0 6px #000}
#fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:3vmin;overflow:auto;text-align:center}
.scr.bgd{background:linear-gradient(180deg,rgba(3,6,20,.2),rgba(3,6,20,.82))}
.logo{font-weight:800;font-style:italic;font-size:min(18vmin,160px);letter-spacing:.04em;line-height:.95;background:linear-gradient(180deg,#fff 10%,#19e3ff 55%,#ff3da6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(25,227,255,.55)) drop-shadow(0 6px 0 rgba(0,0,0,.4));transform:skewX(-8deg)}
.logo b{font-size:1.15em;color:var(--c3);-webkit-text-fill-color:var(--c3)}
.tag{font-size:min(2.6vmin,22px);color:var(--c1);letter-spacing:.5em;margin:.6vmin 0 4vmin;font-weight:600}
.menu{display:flex;flex-direction:column;gap:1.2vmin;align-items:stretch;min-width:min(60vmin,420px)}
.btn{font:inherit;font-weight:800;font-style:italic;font-size:min(3.2vmin,26px);letter-spacing:.12em;color:#fff;background:linear-gradient(90deg,rgba(25,227,255,.18),rgba(255,61,166,.18));border:2px solid rgba(255,255,255,.5);padding:1.5vmin 3vmin;cursor:pointer;transform:skewX(-10deg);border-radius:6px;transition:all .12s;text-transform:uppercase}

.btn:hover,.btn.on{background:linear-gradient(90deg,#19e3ff,#ff3da6);border-color:#fff;box-shadow:0 0 24px rgba(25,227,255,.8);transform:skewX(-10deg) scale(1.05)}

.btn.dis{opacity:.4;pointer-events:none}

.row{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center;align-items:stretch}

.pill{display:inline-block;padding:.4vmin 1.4vmin;border:1px solid var(--c1);border-radius:20px;color:var(--c1);font-size:min(1.9vmin,15px);margin:0 .4vmin;font-style:normal;cursor:pointer}
.pill.on{background:var(--c1);color:#001}
table.res{border-collapse:collapse;font-size:min(2.4vmin,20px);min-width:min(70vmin,520px);font-style:italic}
table.res td,table.res th{padding:.7vmin 1.6vmin;border-bottom:1px solid rgba(255,255,255,.15);text-align:left}
table.res tr.me{background:linear-gradient(90deg,rgba(25,227,255,.35),rgba(255,61,166,.25));font-weight:800}
.hint{font-family:system-ui,sans-serif;font-style:normal;color:var(--dim);font-size:min(1.9vmin,15px);margin-top:1.4vmin;line-height:1.5;max-width:70vmin}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch button{position:absolute;pointer-events:auto;font:inherit;font-weight:800;color:#fff;background:rgba(25,227,255,.22);border:2px solid rgba(255,255,255,.55);border-radius:50%;width:15vmin;height:15vmin;font-size:2.6vmin;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#touch button:active,#touch button.dn{background:rgba(255,61,166,.6)}
#pausebtn{position:absolute;right:2.4vmin;top:calc(2.4vmin + min(25vmin,230px));pointer-events:auto;background:rgba(5,10,30,.5);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:.8vmin 1.4vmin;font:inherit;font-size:min(2vmin,16px);display:none}
#load{position:absolute;inset:0;background:#050816;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .5s}
#load .bar{width:min(50vmin,380px);height:10px;border:2px solid #19e3ff;border-radius:10px;margin-top:3vmin;overflow:hidden;transform:skewX(-14deg)}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#19e3ff,#ff3da6);transition:width .2s}
</style>
</head>
<body>
<div id="app">
<canvas id="gl"></canvas>
<div id="fx"></div><div id="flash"></div>
<div id="hud">
 <div id="pos" class="big">1<small>/8</small></div><div id="lap" class="big">LAP 1/3</div><div id="time">0:00.00</div>
 <canvas id="mini" width="440" height="440"></canvas>
 <div id="spd" class="big">0<small>KM/H</small></div>
 <div id="airw"><div id="airl"><span>AIR</span><span id="airn">100</span></div><div id="airb"><div id="airf"></div></div><div id="boostb"><div id="boostf"></div></div></div>
 <div id="msg" class="big"></div><div id="sub"></div><div id="trick" class="big"></div><div id="board"></div>
 <button id="pausebtn">II PAUSE</button>
</div>
<div id="touch"></div>
<div id="ui"></div>
<div id="load"><div class="logo" style="font-size:min(14vmin,120px)">RYDER <b>X</b></div><div class="bar"><i id="loadf"></i></div></div>
</div>
<script type="module">
/* ---- b_util.js ---- */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== utilities ============================== */
const TAU = Math.PI * 2, $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v), lerp = (a, b, t) => a + (b - a) * t, sstep = (t) => t * t * (3 - 2 * t);
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const wrapPI = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const fmtTime = (t) => { if (!isFinite(t) || t == null) return '--:--.--'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
const ord = (n) => ['', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'][n] || n + 'th';

/* ============================== save data ============================== */
const SAVE_KEY = 'ryderx.save.v1';
const DEF_SAVE = { best: {}, ghosts: {}, cups: {}, opt: { vol: 0.8, mus: 0.6, sfx: 0.9, bloom: 1, laps: 3, steer: 1, hud: 1, shake: 1 }, board: { type: 'speed', color: 0, rider: 0 }, avatar: 'oasis', stats: { races: 0, wins: 0, tricks: 0 } };
let SAVE = JSON.parse(JSON.stringify(DEF_SAVE));
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) { SAVE = Object.assign(SAVE, s); SAVE.opt = Object.assign({}, DEF_SAVE.opt, s.opt || {}); SAVE.board = Object.assign({}, DEF_SAVE.board, s.board || {}); SAVE.stats = Object.assign({}, DEF_SAVE.stats, s.stats || {}); } } catch (e) { /* storage unavailable */ }
let _saveT = 0; function save(now) { clearTimeout(_saveT); const f = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* quota or private mode */ } }; if (now) f(); else _saveT = setTimeout(f, 400); }

/* ============================== IndexedDB for an uploaded VRM ============================== */
const IDB = { p: null };
function idb() { return IDB.p || (IDB.p = new Promise((res, rej) => { try { const q = indexedDB.open('ryderx', 1); q.onupgradeneeded = () => q.result.createObjectStore('a'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch (e) { rej(e); } })); }
async function idbPut(k, v) { try { const d = await idb(); return await new Promise((res) => { const t = d.transaction('a', 'readwrite'); t.objectStore('a').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); } catch (e) { return false; } }
async function idbGet(k) { try { const d = await idb(); return await new Promise((res) => { const q = d.transaction('a').objectStore('a').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }

/* ============================== lazy VRM library ============================== */
let _vrmLib = null;
function vrmLib() { return _vrmLib || (_vrmLib = Promise.all([import('three/addons/loaders/GLTFLoader.js'), import('@pixiv/three-vrm')]).then(([g, v]) => ({ GLTFLoader: g.GLTFLoader, VRMLoaderPlugin: v.VRMLoaderPlugin, VRMUtils: v.VRMUtils }))); }
/* ---- c_audio.js ---- */
/* ============================== audio: engine, effects, procedural synthwave ============================== */
const SCALES = { maj: [0, 2, 4, 5, 7, 9, 11], min: [0, 2, 3, 5, 7, 8, 10], dor: [0, 2, 3, 5, 7, 9, 10], phr: [0, 1, 3, 5, 7, 8, 10] };
const AUD = {
    ctx: null, on: false, m: null, sfxG: null, musG: null, eng: null, mus: { timer: 0, step: 0, next: 0, def: null, rng: null, playing: false }, paused: false,
    init() {
        if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
        try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; const c = this.ctx = new C(); this.on = true;
            this.m = c.createGain(); const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5; this.m.connect(comp); comp.connect(c.destination);
            this.sfxG = c.createGain(); this.sfxG.connect(this.m); this.musG = c.createGain(); this.musG.connect(this.m); this.setVol();
            const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.noiseBuf = nb;
            // engine: two detuned oscillators + wind noise
            const e = this.eng = { o1: c.createOscillator(), o2: c.createOscillator(), g: c.createGain(), lp: c.createBiquadFilter(), n: c.createBufferSource(), ng: c.createGain(), nf: c.createBiquadFilter(), dn: c.createBufferSource(), dg: c.createGain(), df: c.createBiquadFilter() };
            e.o1.type = 'sawtooth'; e.o2.type = 'square'; e.lp.type = 'lowpass'; e.lp.frequency.value = 400; e.g.gain.value = 0; e.o1.connect(e.lp); e.o2.connect(e.lp); e.lp.connect(e.g); e.g.connect(this.sfxG); e.o1.start(); e.o2.start();
            e.n.buffer = nb; e.n.loop = true; e.nf.type = 'bandpass'; e.nf.frequency.value = 900; e.nf.Q.value = 0.6; e.ng.gain.value = 0; e.n.connect(e.nf); e.nf.connect(e.ng); e.ng.connect(this.sfxG); e.n.start();
            e.dn.buffer = nb; e.dn.loop = true; e.df.type = 'bandpass'; e.df.frequency.value = 2400; e.df.Q.value = 3; e.dg.gain.value = 0; e.dn.connect(e.df); e.df.connect(e.dg); e.dg.connect(this.sfxG); e.dn.start();
        } catch (err) { this.ctx = null; this.on = false; }
    },
    setVol() { if (!this.ctx) return; const o = SAVE.opt, t = this.ctx.currentTime; this.m.gain.setTargetAtTime(o.vol, t, 0.05); this.sfxG.gain.setTargetAtTime(o.sfx, t, 0.05); this.musG.gain.setTargetAtTime(o.mus * 0.6, t, 0.05); },
    pause(p) { this.paused = p; if (!this.ctx) return; if (p) this.eng.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05); },
    tone(f, d, type, vol, slide, when, dest) { if (!this.ctx) return; const c = this.ctx, t = when || c.currentTime, o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + d + 0.05); },
    noise(d, vol, f0, f1, q, type, when, dest) { if (!this.ctx) return; const c = this.ctx, t = when || c.currentTime, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = this.noiseBuf; fl.type = type || 'bandpass'; fl.Q.value = q || 1; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + d); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.04, d / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(fl); fl.connect(g); g.connect(dest || this.sfxG); s.start(t, Math.random()); s.stop(t + d + 0.05); },
    ev(type, d) {
        if (!this.ctx) return; const T = this.tone.bind(this), N = this.noise.bind(this);
        switch (type) {
            case 'count': T(d === 1 ? 660 : 440, 0.22, 'square', 0.18); break;
            case 'go': T(880, 0.5, 'square', 0.22); T(1320, 0.5, 'sawtooth', 0.1); N(0.5, 0.2, 400, 4000, 1); break;
            case 'ring': T(1320, 0.1, 'triangle', 0.22); T(1760, 0.18, 'triangle', 0.2, 0, this.ctx.currentTime + 0.06); break;
            case 'pad': N(0.7, 0.28, 300, 3400, 1.2); T(240, 0.6, 'sawtooth', 0.12, 700); break;
            case 'jump': T(220, 0.25, 'sine', 0.3, 520); N(0.2, 0.1, 800, 2500, 1); break;
            case 'launch': N(0.5, 0.15, 500, 2200, 0.8); break;
            case 'land': N(0.18, Math.min(0.5, 0.15 + (d || 0) * 0.012), 300, 80, 1, 'lowpass'); T(90, 0.2, 'sine', 0.35, 45); break;
            case 'trick': T(660 + 120 * (d || 1), 0.12, 'square', 0.12, 1100 + 120 * (d || 1)); break;
            case 'trickland': for (let i = 0; i < 3; i++) T([523, 659, 784][i] * (1 + 0.06 * (d.n || 1)), 0.18, 'triangle', 0.18, 0, this.ctx.currentTime + i * 0.06); break;
            case 'sloppy': N(0.3, 0.3, 500, 100, 1); break;
            case 'boost': N(0.55, 0.3, 300, 3200, 0.9); T(110, 0.5, 'sawtooth', 0.16, 330); break;
            case 'minit': N(0.5, 0.25, 600, 4000, 1.2); T(330, 0.4, 'square', 0.1, 990); break;
            case 'driftstart': N(0.25, 0.1, 2200, 1500, 4); break;
            case 'crash': N(0.4, 0.55, 700, 60, 0.7); T(80, 0.35, 'square', 0.3, 38); break;
            case 'wall': N(0.25, 0.3, 3000, 800, 3); break;
            case 'smash': N(0.45, 0.6, 1800, 120, 0.6); T(140, 0.3, 'sawtooth', 0.25, 50); break;
            case 'shove': case 'bump': N(0.2, 0.3, 500, 150, 1); break;
            case 'finish': [523, 659, 784, 1046, 1318].forEach((f, i) => T(f, 0.4, 'triangle', 0.2, 0, this.ctx.currentTime + i * 0.09)); break;
            case 'results': T(392, 0.5, 'triangle', 0.12); break;
            case 'ui': T(700, 0.05, 'square', 0.07); break;
            case 'uiok': T(520, 0.07, 'square', 0.09); T(780, 0.1, 'square', 0.09, 0, this.ctx.currentTime + 0.06); break;
        }
    },
    engineStart() { },
    engine(v, boost, air, drift, active, hh) {
        if (!this.ctx || !this.eng) return; const e = this.eng, t = this.ctx.currentTime, f = clamp(v / 70, 0, 1.4);
