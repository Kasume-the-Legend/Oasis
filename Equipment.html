<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Oasis · Equipment Shop</title>
<style>
:root{--bg:#070b1c;--panel:#101a46;--panel2:#0b1257;--line:#e3e9ff;--ink:#f2f5ff;--dim:#9fb0ee;--gold:#ffd24a;--good:#7dffa8;--bad:#ff8a8a;--acc:#6fd0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 13px/1.35 Nunito,system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%;padding:8px;gap:6px;max-width:1200px;margin:0 auto}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font:800 14px Orbitron,Nunito,sans-serif;letter-spacing:.12em;color:var(--acc)}
.gil{margin-left:auto;padding:4px 12px;border-radius:999px;background:#0b1257;border:2px solid var(--line);font-weight:800;color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{padding:5px 11px;border-radius:999px;border:2px solid #4a5aa8;background:#14206b;color:var(--ink);font:800 12px Nunito,sans-serif;cursor:pointer}
.tab.on{border-color:var(--gold);background:#2b3a9a;color:#fff}
.sep{width:1px;height:20px;background:#3a4a98;margin:0 4px}
input.q{padding:5px 10px;border-radius:8px;border:2px solid #4a5aa8;background:#0a1040;color:#fff;width:130px;font:600 12px Nunito,sans-serif}
.main{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;min-height:0}
.box{background:linear-gradient(#2036a8,#0b1257);border:2px solid var(--line);border-radius:10px;box-shadow:0 0 0 2px #050834;padding:6px;min-height:0;overflow:auto}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:7px;border-bottom:1px solid #ffffff14}
.row:hover{background:#ffffff12}
.row.worn{background:#ffe14a22;outline:1px solid var(--gold)}
.g{display:inline-block;font:800 9px Orbitron,sans-serif;padding:2px 5px;border-radius:5px;background:#000a;color:#fff}
.g7{color:#8ad4ff}.g8{color:#ffb36a}.g9{color:#b9ff8a}
.nm{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.chip{font:700 10px Nunito,sans-serif;padding:1px 5px;border-radius:5px;background:#000a;color:#cfe0ff}
.chip.i{color:var(--good)}.chip.s{color:#ffd98a}
.btn{padding:5px 10px;border-radius:8px;border:2px solid var(--gold);background:#3a2a00;color:var(--gold);font:800 12px Nunito,sans-serif;cursor:pointer;white-space:nowrap}
.btn.g2{border-color:#6fe8a8;background:#06361e;color:#8dffc4}
.btn.r{border-color:#ff7a7a;background:#3a0a0a;color:#ffaaaa}
.btn:disabled{opacity:.4;cursor:default}
.lv{font:800 10px Orbitron,sans-serif;color:var(--gold)}
.bar{height:5px;background:#000a;border-radius:3px;overflow:hidden;margin-top:3px;width:90px}
.bar u{display:block;height:100%;background:linear-gradient(#ffe86a,#e0a21a)}
h3{margin:0 0 4px;font:800 11px Orbitron,sans-serif;letter-spacing:.1em;color:#9fe8ff}
.slot{display:grid;grid-template-columns:62px 1fr auto;gap:6px;align-items:center;padding:4px 4px;border-bottom:1px solid #ffffff14}
.slot small{color:var(--dim)}
.tot{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.tot .chip{font-size:11px;padding:2px 7px}
.note{color:var(--dim);font-size:11px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#0b1257;border:2px solid var(--gold);color:#fff;padding:7px 14px;border-radius:10px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media(max-width:760px){.main{grid-template-columns:1fr}.box.me{display:none}.me-on .box.me{display:block}.me-on .box.list{display:none}}
</style></head><body>

/* ---------- build the catalogue ---------- */
const SLOTS = [['weapon', 'Weapon'], ['head', 'Head'], ['body', 'Body'], ['wrist', 'Wrist'], ['acc', 'Accessory']];
const CLASSES = [['hero', 'Hero', '⚔️'], ['gunner', 'Gunner', '🔫'], ['fighter', 'Fighter', '🥋'], ['mage', 'Mage', '🔮']];
const BAD = ['poison', 'venom', 'dark', 'silence', 'sleep', 'slow', 'stop', 'confuse', 'berserk', 'mini', 'stone'];
const CHAR_CLS = { Cloud: 'hero', Cid: 'hero', Sephiroth: 'hero', Squall: 'hero', Seifer: 'hero', Kiros: 'hero', Ward: 'hero', Barret: 'gunner', Vincent: 'gunner', Yuffie: 'gunner', Rinoa: 'gunner', Irvine: 'gunner', Laguna: 'gunner', Tifa: 'fighter', Zell: 'fighter', Quistis: 'fighter', Aeris: 'mage', 'Red XIII': 'mage', 'Cait Sith': 'mage', Selphie: 'mage' };
const MAXW = { 7: 100, 8: 30, 9: 108 };
const rows = (t) => t.split('\n').map((l) => l.split('|'));
const r10 = (n) => Math.max(10, Math.round(n / 10) * 10);
const ITEMS = [];
function wpn(g, who, name, raw) {
  const cls = CHAR_CLS[who] || who, p = Math.min(1, raw / MAXW[g]), a = Math.round(4 + 150 * Math.pow(p, 1.2)), P = p * 100, b = {};
  if (cls === 'mage') { b.atk = Math.round(a * 0.5); b.mag = Math.round(a * 0.75); b.mp = Math.round(a * 0.4); }
  else if (cls === 'gunner') { b.atk = Math.round(a * 0.95); b.eva = Math.round(P * 0.06); b.crit = Math.round(P * 0.05); }
  else if (cls === 'fighter') { b.atk = Math.round(a * 0.95); b.spd = Math.round(P * 0.12); }
  else { b.atk = a; b.def = Math.round(P * 0.12); }
  ITEMS.push({ id: g + '-w-' + slug(name) + (cls === 'mage' ? '-m' : ''), g, slot: 'weapon', cls: cls === 'mage' ? 'any' : cls, name, b, price: r10(Math.max(50, 12 * Math.pow(P, 1.95))), note: CHAR_CLS[who] ? who : '' });
}
function arm(g, slot, name, raw, max, w, extra) {
  const p = Math.min(1, raw / max), d = Math.round((2 + 55 * Math.pow(p, 1.1)) * w), P = p * 100, b = { def: d, hp: Math.round(d * (slot === 'body' ? 4 : 2.2)) };
  if (extra) Object.assign(b, extra);
  ITEMS.push({ id: g + '-' + slot[0] + '-' + slug(name), g, slot, cls: 'any', name, b, price: r10(Math.max(40, 9 * Math.pow(P, 1.9) * (w + 0.25))) });
}
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
for (const [who, name, raw] of rows(RAW.w7)) wpn(7, who, name, +raw);
for (const [who, name, raw] of rows(RAW.w8)) wpn(8, who, name, +raw);
for (const [who, name, raw] of rows(RAW.w9)) wpn(9, who, name, +raw);

for (const [name, raw] of rows(RAW.a7)) arm(7, 'wrist', name, +raw, 100, 0.55, X7[name]);
for (const [name, raw] of rows(RAW.body9)) arm(9, 'body', name, +raw, 59, 1);
for (const [name, raw] of rows(RAW.head9)) arm(9, 'head', name, +raw, 51, 0.5);
for (const [name, raw] of rows(RAW.wrist9)) arm(9, 'wrist', name, +raw, 53, 0.5);
for (const [name, eff] of rows(RAW.acc7)) {
  const b = {}, o = {}; eff.split(',').forEach((kv) => { const [k, v] = kv.split(':'); o[k] = v; });
